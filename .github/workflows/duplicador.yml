name: Duplicate New Repositories
on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every day at midnight
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Accessing the central repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          submodules: true

      - name: Searching for and duplicating new repositories
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          # 1. Configures secure access credentials using your personal token
          git config --global url."https://$GITHUB_TOKEN@://github.com".insteadOf "https://://github.com"
          git config --global user.name "Duplication Bot"
          git config --global user.email "bot@duplicator.com"
          
          # 2. Fetches absolutely ALL repositories (Public and Private) authorized by your token
          REPOS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.://github.comuser/repos?per_page=100" | jq -r '.[].clone_url')
          
          # 3. Loops through the retrieved list to add new submodules
          for repo in $REPOS; do
            NAME=$(basename "$repo" .git)
            if [ "$NAME" != "all-my-repos-package" ] && [ ! -d "$NAME" ]; then
              echo "Duplicating new project: $NAME"
              git submodule add "$repo" "$NAME"
            fi
          done
          
          # 4. Saves and pushes changes back to GitHub if updates exist
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto: New repositories successfully duplicated!"
            git push origin main
          fi
