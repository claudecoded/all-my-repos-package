name: Duplicate New Repositories
on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every day at midnight
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Accessing the central repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Searching for and duplicating new repositories
        run: |
          # 1. Configura as credenciais usando o próprio robô do GitHub
          git config --global url."https://x-access-token:${{ secrets.MY_GITHUB_TOKEN }}@://github.com".insteadOf "https://://github.com"
          git config --global user.name "Duplication Bot"
          git config --global user.email "bot@duplicator.com"
          
          # 2. Busca os repositórios públicos da sua conta usando seu nome de usuário (claudecoded)
          REPOS=$(curl -s "https://api.://github.comusers/claudecoded/repos?per_page=100" | jq -r '.[].clone_url')
          
          # 3. Percorre a lista adicionando os novos
          for repo in $REPOS; do
            NAME=$(basename "$repo" .git)
            if [ "$NAME" != "all-my-repos-package" ] && [ ! -d "$NAME" ]; then
              echo "Duplicating new project: $NAME"
              git submodule add "$repo" "$NAME"
            fi
          done
          
          # 4. Envia as atualizações de volta
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto: New repositories successfully duplicated!"
            git push origin main
          fi
